
<main class="content scn-view" id="scenariosView" hidden>
  <div class="content-inner">
    <button type="button" class="scn-back" id="scnBack">← К воронке оттока</button>
    <header class="page-head">
      <div>
        <h1 class="page-title">Сценарии оттока</h1>
        <p class="page-sub" id="scnSub">Куда уходят деньги из вкладов после пролонгации</p>
        <span class="scn-synthetic">Синтетические данные · макет</span>
      </div>
      <div class="switch" id="scnMeasure" role="tablist" aria-label="Единица измерения"></div>
    </header>

    <section class="card">
      <div class="scn-head">
        <h2>Отток = 100%</h2>
        <span class="scn-total" id="scnTotal"></span>
      </div>
      <div class="scn-bar" id="scnBar" role="group" aria-label="Декомпозиция оттока по сценариям"></div>
      <ul class="scn-legend" id="scnLegend"></ul>
    </section>

    <section id="scnDetail"></section>

    <p class="page-note" id="scnNote"></p>
  </div>
</main>
