<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Кликстрим — Месячный — выгрузка</title>
<style>:root {
    --bg: #ffffff;
    --surface: #f4f8f4;
    --surface-strong: #e6f0e6;
    --text: #202a20;
    --text-muted: #4d5b4d;
    --accent: #2f7a2f;
    --accent-soft: #d9efdc;
    --border: #c7d5c7;
    --button-text: #ffffff;
    --shadow: rgba(45, 120, 45, 0.16);
}

body.dark {
    --bg: #111111;
    --surface: #1c1c1c;
    --surface-strong: #262626;
    --text: #f5f1ec;
    --text-muted: #c8c1b9;
    --accent: #e07618;
    --accent-soft: #3f2a11;
    --border: #3a3a3a;
    --button-text: #111111;
    --shadow: rgba(0, 0, 0, 0.4);
}

* {
    box-sizing: border-box;
}

html, body {
    min-height: 100%;
}

body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(circle at top left, rgba(75, 155, 75, 0.12), transparent 28%),
                radial-gradient(circle at bottom right, rgba(46, 120, 46, 0.14), transparent 25%),
                var(--bg);
    color: var(--text);
    transition: background 0.3s ease, color 0.3s ease;
}

body.dark {
    background: radial-gradient(circle at top left, rgba(224, 122, 29, 0.12), transparent 30%),
                radial-gradient(circle at bottom right, rgba(255, 145, 50, 0.14), transparent 26%),
                var(--bg);
}

.page {
    max-width: 1440px;
    margin: 0 auto;
    padding: 28px 20px 40px;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 24px;
    margin-bottom: 28px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface);
    box-shadow: 0 18px 50px -40px var(--shadow);
}

header h1 {
    margin: 0;
    font-size: clamp(1.5rem, 2vw, 2.2rem);
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
}

.button, .theme-toggle {
    cursor: pointer;
    border: none;
    border-radius: 999px;
    padding: 12px 18px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.2s ease, background-color 0.25s ease, color 0.25s ease;
}

.button:hover, .theme-toggle:hover {
    transform: translateY(-1px);
}

.button {
    background: var(--accent);
    color: var(--button-text);
}

.theme-toggle {
    background: rgba(255,255,255,0.1);
    color: var(--text);
    border: 1px solid var(--border);
}

.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 20px 55px -45px var(--shadow);
}

.card h2 {
    margin-top: 0;
}

form {
    display: grid;
    gap: 16px;
}

label {
    display: block;
    font-size: 0.98rem;
    color: var(--text-muted);
}

input[type="text"],
input[type="email"],
input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
}

input[type="submit"] {
    width: fit-content;
    background: var(--accent);
    color: var(--button-text);
    cursor: pointer;
}

ul {
    padding-left: 18px;
    margin: 0;
}

li {
    margin-bottom: 10px;
}

footer {
    text-align: center;
    color: var(--text-muted);
    margin-top: 30px;
}

.button-lg {
    padding: 16px 28px;
    font-size: 1.05rem;
}

.error {
    color: #c85454;
    padding: 14px 18px;
    border-radius: 12px;
    background: rgba(200,84,84,0.12);
    border: 1px solid rgba(200,84,84,0.2);
}

.button-danger {
    background: transparent;
    color: #c85454;
    border: 1px solid rgba(200,84,84,0.3);
}
.button-danger:hover {
    background: rgba(200,84,84,0.1);
    border-color: rgba(200,84,84,0.55);
}

/* ── Компоненты пользовательских отчётов ── */
.summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 22px;
    display: inline-flex;
    flex-direction: column;
    gap: 4px;
    min-width: 160px;
    box-shadow: 0 8px 24px -16px var(--shadow);
}
.summary-label {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 500;
}
.summary-value {
    font-size: 1.7rem;
    font-weight: 700;
    line-height: 1.1;
    color: var(--text);
}
.summary-sub {
    font-size: 0.75rem;
    color: var(--text-muted);
}

.conv-high {
    background: #dcfce7;
    color: #166534;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    display: inline-block;
}
.conv-mid {
    background: #fef9c3;
    color: #854d0e;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    display: inline-block;
}
.conv-low {
    background: #fee2e2;
    color: #991b1b;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    display: inline-block;
}

.bar-track {
    background: var(--border);
    border-radius: 999px;
    height: 10px;
    overflow: hidden;
}
.bar-fill {
    background: var(--accent);
    height: 100%;
    border-radius: 999px;
    transition: width 0.3s ease;
}


        .filter-row {
            display: flex;
            gap: 16px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 180px;
        }
        .filter-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .filter-select {
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
        }
        .filter-select:focus { outline: 2px solid var(--accent); }

        /* Period toggle pills */
        .period-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 4px;
        }
        .period-pill {
            padding: 6px 16px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .period-pill:hover { background: var(--surface-strong); }
        .period-pill.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 700;
        }

        /* Funnel table */
        .funnel-wrap {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        .funnel-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .funnel-table thead { background: var(--surface-strong); }
        .funnel-table th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .funnel-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        .funnel-table tr:last-child td { border-bottom: none; }
        .funnel-table tbody tr:hover td { background: var(--surface-strong); }

        .step-num {
            width: 36px;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
        }
        .step-name { font-weight: 600; }
        .step-value {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            white-space: nowrap;
        }
        .conv-cell {
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            font-size: 0.88rem;
        }
        .delta-cell {
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            font-size: 0.85rem;
        }

        .conv-badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .conv-high  { background: rgba(47,122,47,0.12);  color: #2f7a2f; }
        .conv-mid   { background: rgba(200,150,40,0.12); color: #b58820; }
        .conv-low   { background: rgba(200,84,84,0.12);  color: #c85454; }
        body.dark .conv-high { color: #6dbf6d; }
        body.dark .conv-mid  { color: #e0c060; }
        body.dark .conv-low  { color: #e07070; }

        .bar-cell { width: 200px; }
        .bar-track {
            height: 10px;
            border-radius: 999px;
            background: var(--surface-strong);
            overflow: hidden;
            min-width: 60px;
        }
        .bar-fill {
            height: 100%;
            border-radius: 999px;
            background: var(--accent);
            transition: width 0.5s ease;
        }

        .funnel-summary {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .summary-card {
            flex: 1;
            min-width: 140px;
            padding: 16px 18px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--surface);
        }
        .summary-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 6px;
        }
        .summary-value {
            font-size: 1.4rem;
            font-weight: 800;
            line-height: 1;
        }
        .summary-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Traffic light */
        .traffic-light-block {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 20px;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--surface);
        }
        .traffic-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .traffic-dot-green  { background: #2f7a2f; }
        .traffic-dot-yellow { background: #b58820; }
        .traffic-dot-red    { background: #c85454; }
        body.dark .traffic-dot-green  { background: #6dbf6d; }
        body.dark .traffic-dot-yellow { background: #e0c060; }
        body.dark .traffic-dot-red    { background: #e07070; }

        .traffic-label {
            font-weight: 700;
            font-size: 1rem;
        }
        .traffic-green  { color: #2f7a2f; }
        .traffic-yellow { color: #b58820; }
        .traffic-red    { color: #c85454; }
        body.dark .traffic-green  { color: #6dbf6d; }
        body.dark .traffic-yellow { color: #e0c060; }
        body.dark .traffic-red    { color: #e07070; }

        .traffic-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        /* Tooltip */
        .tooltip-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .tooltip-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 15px; height: 15px;
            border-radius: 50%;
            background: var(--text-muted);
            color: var(--bg);
            font-size: 0.65rem; font-weight: 800;
            cursor: default;
            margin-left: 5px; flex-shrink: 0; line-height: 1;
        }
        .tooltip-box {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            width: 280px;
            background: var(--surface-strong);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.8rem; font-weight: 400;
            line-height: 1.55; color: var(--text);
            text-transform: none; letter-spacing: 0;
            white-space: normal; z-index: 100;
            box-shadow: 0 8px 24px -8px var(--shadow);
        }
        .tooltip-wrap:hover .tooltip-box { display: block; }
        .tooltip-step { margin-bottom: 6px; }
        .tooltip-step:last-child { margin-bottom: 0; }
        .tooltip-num {
            display: inline-block; width: 16px;
            font-weight: 700; color: var(--accent);
        }

        /* Recommendations block */
        .rec-block {
            margin-top: 12px;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }
        .rec-header {
            padding: 12px 18px;
            background: var(--surface-strong);
            border-bottom: 1px solid var(--border);
        }
        .rec-header-title {
            font-size: 0.8rem; font-weight: 600;
            letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted);
        }
        .rec-block-green .rec-header {
            background: color-mix(in srgb, #2f7a2f 8%, var(--surface));
            border-bottom: 1px solid color-mix(in srgb, #2f7a2f 20%, var(--border));
        }
        body.dark .rec-block-green .rec-header {
            background: color-mix(in srgb, #6dbf6d 8%, var(--surface));
        }
        .rec-green-text {
            padding: 14px 18px;
            font-size: 0.87rem; font-weight: 600;
            color: #2f7a2f;
        }
        body.dark .rec-green-text { color: #6dbf6d; }
        .rec-item {
            display: flex; gap: 12px;
            padding: 11px 18px;
            border-bottom: 1px solid var(--border);
            font-size: 0.87rem; line-height: 1.65;
        }
        .rec-item:last-child { border-bottom: none; }
        .rec-num {
            flex-shrink: 0;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 0.72rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            margin-top: 2px;
        }
        .rec-text a { color: var(--accent); text-decoration: underline; }

        /* Deltas */
        .delta-pos { color: #2f7a2f; }
        .delta-neg { color: #c85454; }
        body.dark .delta-pos { color: #6dbf6d; }
        body.dark .delta-neg { color: #e07070; }

        /* Steps detail block */
        .cr-analytics-block {
            margin-top: 12px;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }
        .cr-analytics-header {
            padding: 12px 18px;
            background: var(--surface-strong);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }
        .cr-analytics-title {
            font-size: 0.8rem; font-weight: 600;
            letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted);
        }
        .cr-badge {
            display: inline-block; padding: 2px 10px; border-radius: 6px;
            font-size: 0.72rem; font-weight: 700;
        }
        .cr-badge-local       { background: rgba(200,84,84,0.12);  color: #c85454; }
        .cr-badge-distributed { background: rgba(124,58,237,0.10); color: #7c3aed; }
        .cr-badge-cascade     { background: rgba(200,84,84,0.12);  color: #c85454; }
        .cr-badge-traffic     { background: rgba(180,83,9,0.10);   color: #b45309; }
        .cr-badge-stable      { background: rgba(47,122,47,0.10);  color: #2f7a2f; }
        body.dark .cr-badge-local       { color: #e07070; }
        body.dark .cr-badge-distributed { color: #a78bfa; }
        body.dark .cr-badge-cascade     { color: #e07070; }
        body.dark .cr-badge-traffic     { color: #fbbf24; }
        body.dark .cr-badge-stable      { color: #6dbf6d; }
        .cr-analytics-text {
            padding: 14px 18px; font-size: 0.87rem; line-height: 1.65;
            background: color-mix(in srgb, var(--accent) 4%, var(--surface));
        }
        .cr-tip-wrap { display: inline-flex; align-items: center; margin-left: 6px; }
        .cr-tip-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 15px; height: 15px; border-radius: 50%;
            background: var(--text-muted); color: var(--bg);
            font-size: 0.65rem; font-weight: 800; cursor: default; line-height: 1;
        }
        .cr-tip-box {
            display: none; position: fixed;
            width: 480px; background: var(--surface-strong);
            border: 1px solid var(--border); border-radius: 12px;
            padding: 12px 14px; font-size: 0.8rem; font-weight: 400;
            line-height: 1.55; color: var(--text); text-transform: none;
            letter-spacing: 0; white-space: normal; z-index: 9999;
            box-shadow: 0 8px 24px -8px var(--shadow);
        }
        .cr-tip-wrap:hover .cr-tip-box { display: block; }
        .steps-detail-block {
            margin-top: 12px;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }
        .steps-detail-header {
            padding: 12px 18px;
            background: var(--surface-strong);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }
        .step-detail-cols { grid-template-columns: 24px 1fr 44px 68px 80px 80px 70px; }
        .step-detail-row {
            display: grid;
            align-items: center;
            gap: 10px;
            padding: 11px 18px;
            border-bottom: 1px solid var(--border);
        }
        .step-detail-row:last-child { border-bottom: none; }
        .step-detail-row:hover { background: var(--surface-strong); }
        .step-detail-thead {
            display: grid;
            align-items: center;
            gap: 10px;
            padding: 7px 18px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
        }
        .step-detail-num {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-align: right;
        }
        .step-detail-name {
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .step-detail-count {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-align: center;
        }
        .step-detail-delta { text-align: center; }
        .step-detail-mom   { text-align: center; font-variant-numeric: tabular-nums; font-size: 0.82rem; white-space: nowrap; }
        .step-detail-pct {
            font-variant-numeric: tabular-nums;
            font-size: 0.82rem;
            text-align: right;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .bar-fill-warn { background: #c85454; }
        body.dark .bar-fill-warn { background: #e07070; }

        /* Event actions column */
        .ea-badge {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 28px; height: 22px; padding: 0 8px;
            border-radius: 999px; background: var(--accent);
            color: #fff; font-size: 0.72rem; font-weight: 700;
            cursor: pointer; user-select: none;
            transition: opacity 0.15s;
        }
        .ea-badge:hover { opacity: 0.8; }
        .ea-badge.active { background: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 0 0 4px var(--bg); }
        .ea-expanded td { padding: 0 !important; border-bottom: 1px solid var(--border); }
        .ea-detail {
            padding: 10px 18px 12px 48px;
            background: color-mix(in srgb, var(--accent) 4%, var(--surface));
            border-top: 1px dashed var(--border);
        }
        .ea-detail-label {
            font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 8px;
        }
        .ea-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .ea-item {
            background: var(--surface-strong); border: 1px solid var(--border);
            border-radius: 8px; padding: 4px 10px;
            font-size: 0.8rem; line-height: 1.4;
        }

        /* NRT intersection badge in funnel table */
        .nrt-int-badge {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 28px; height: 22px; padding: 0 8px;
            border-radius: 999px; font-size: 0.72rem; font-weight: 700;
        }
        .nrt-int-full    { background: rgba(47,122,47,0.15);   color: #2f7a2f; }
        .nrt-int-partial { background: rgba(200,150,40,0.15);  color: #b58820; }
        .nrt-int-none    { background: var(--surface-strong);  color: var(--text-muted); }
        body.dark .nrt-int-full    { color: #6dbf6d; }
        body.dark .nrt-int-partial { color: #e0c060; }

        /* NRT match section inside event detail panel */
        .nrt-section {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
        }
        .nrt-section-label {
            font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 10px;
        }
        .nrt-product-block {
            margin-bottom: 10px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface-strong);
        }
        .nrt-product-block:last-child { margin-bottom: 0; }
        .nrt-product-header {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 8px;
        }
        .nrt-product-name {
            font-size: 0.85rem; font-weight: 700;
        }
        .nrt-match-count {

            + `<table style="width:100%;border-collapse:collapse;font-size:0.78rem;line-height:1.5;">`
            + `<thead><tr>`
            + `<th style="text-align:left;padding:4px 8px 6px 0;border-bottom:1px solid var(--border);color:var(--text-muted);font-weight:600;width:40%">Ситуация</th>`
            + `<th style="text-align:left;padding:4px 0 6px 8px;border-bottom:1px solid var(--border);color:var(--text-muted);font-weight:600;">Условие → Вывод</th>`
            + `</tr></thead><tbody>`
            + `<tr><td style="${td0}">CR стабилен</td>`
            + `<td style="${td1}">Ни один шаг не потерял более <b>2 пп</b> CR И трафик не упал более чем на <b>5%</b>.</td></tr>`
            + `<tr><td style="${td0}">Падение трафика</td>`
            + `<td style="${td1}">Трафик на входе снизился более чем на <b>5%</b> И ни один шаг не потерял более <b>2 пп</b> CR.</td></tr>`
            + `<tr><td style="${td0}">Локальный барьер</td>`
            + `<td style="${td1}">От <b>1 до 2</b> шагов потеряли более <b>2 пп</b> CR. Доминирующий шаг с наибольшим спадом выделяется как барьер.</td></tr>`
            + `<tr><td style="${td0}">Каскадное падение</td>`
            + `<td style="${td1}"><b>3 и более</b> шагов потеряли более <b>2 пп</b> CR, при этом все они <b>идут подряд</b> по номеру шага.</td></tr>`
            + `<tr><td style="${td0l}">Системное снижение</td>`
            + `<td style="${td1l}"><b>3 и более</b> шагов потеряли более <b>2 пп</b> CR, но они <b>не идут подряд</b> (распределены по воронке).</td></tr>`
            + `</tbody></table>`;
        const periodMark = currentPeriodType === 'weekly' ? 'н/н' : 'м/м';

            <div class="cr-analytics-header">
                <span style="display:inline-flex;align-items:baseline;gap:5px;">

                </span>
                <span class="cr-tip-wrap" onmouseenter="positionTip(this)">
                    <span class="cr-tip-icon">?</span>
                    <span class="cr-tip-box">${tipText}</span>
                </span>
                <span class="cr-badge cr-badge-${analytics.pattern}" style="margin-left:auto;">${label}</span>
            </div>
            <div class="cr-analytics-text">${analytics.text}</div>
        </div>`;
    }

function buildRecommendations(data, funnelName) {
        const tl = data.traffic_light || 'yellow';
        const fr = data.funnel_report || {};
        const barrier = (data.analytics || {}).barrier;

        const header = `<div class="rec-header"><span class="rec-header-title">Рекомендации</span></div>`;

        if (tl === 'green') {
            return `<div class="rec-block rec-block-green">${header}<div class="rec-green-text">✅ Продажи растут. Так держать!</div></div>`;
        }

        const items = [];
        const stepDrops = (data.analytics || {}).step_drops || [];

        // Определяем шаг с наибольшим снижением CR (barrier → худший из step_drops → худший по абс. conv_from_prev)
        let worstStep = barrier;
        let worstStepIsMoM = true;
        if (!worstStep && stepDrops.length > 0) {
            const neg = stepDrops.filter(s => s.delta_cr < 0);
            if (neg.length > 0) worstStep = neg.reduce((a, b) => a.delta_cr < b.delta_cr ? a : b);
        }
        if (!worstStep) {
            // Нет МоМ данных — берём шаг с наименьшей конверсией к предыдущему шагу
            const stepsArr = Object.entries(data.funnel || {})
                .map(([sn, s]) => ({step: +sn, step_name: s.step_name, conv_from_prev: s.conv_from_prev}))
                .filter(s => s.conv_from_prev != null && s.conv_from_prev < 1);
            if (stepsArr.length > 0) {
                const w = stepsArr.reduce((a, b) => a.conv_from_prev < b.conv_from_prev ? a : b);
                worstStep = {step: w.step, step_name: w.step_name, delta_cr: null};
                worstStepIsMoM = false;
            }
        }

        // 1. Worst step
        if (worstStep) {
            const detail = worstStep.delta_cr != null
                ? ` — здесь наибольшая потеря CR (−${Math.abs(worstStep.delta_cr).toFixed(1)} пп) и отрицательная динамика М/М`
                : ` — наименьшая конверсия к предыдущему шагу`;
            items.push(`<div class="rec-item"><div class="rec-num">1</div><div class="rec-text">Проверьте шаг ${worstStep.step} «${worstStep.step_name}»${detail}.</div></div>`);
        } else {
            items.push(`<div class="rec-item"><div class="rec-num">1</div><div class="rec-text">Проверьте динамику конверсии по шагам воронки — найдите этап с наибольшим снижением.</div></div>`);
        }

        // 2. CJ research
        const stepRef = worstStep ? `На шаге ${worstStep.step} «${worstStep.step_name}» — ` : '';
        items.push(`<div class="rec-item"><div class="rec-num">2</div><div class="rec-text">${stepRef}проведите исследование CJ в агенте или посмотрите уже готовые рекомендации: <a href="https://cjxplorer.com/invite/b6eb223a-90b9-42bd-ae6a-d5f57f727f09" target="_blank">CJXplorer →</a>.</div></div>`);

        // 3. Campaign funnel MoM sales delta
        const salesCurr = fr.sales_current;
        const salesPrev = fr.sales_prev;
        const salesDelta = fr.sales_delta;
        const salesPct = fr.sales_pct_change;
        const topNeg = (fr.channel_top_changes || []).filter(c => c.delta < 0).slice(0, 3);
        let rec3 = '';
        if (salesDelta != null && salesDelta < 0 && salesCurr != null && salesPrev != null) {
            const currStr = _fmt(salesCurr);
            const prevStr = _fmt(salesPrev);
            const deltaStr = _fmt(Math.abs(salesDelta));
            const pctStr = salesPct != null ? `, −${Math.abs(salesPct)}% М/М` : '';
            rec3 = `Продажи от кампаний коммуникаций: ${currStr} шт. (было ${prevStr} шт., −${deltaStr} шт.${pctStr}).`;
            if (topNeg.length > 0) {
                const losses = topNeg.map(c => `канал «${c.channel}», этап «${c.step_name}» (−${_fmt(Math.abs(c.delta))} шт.)`).join('; ');
                rec3 += ` Основные потери: ${losses}.`;
            }
        } else {
            rec3 = `Проверьте кампании по продажам (<a href="/funnel" target="_blank">отчёт по воронке продаж кампейнинга</a>).`;
        }
        items.push(`<div class="rec-item"><div class="rec-num">3</div><div class="rec-text">${rec3}</div></div>`);

        // П.4 — NRT-покрытие: конкретные проблемы
        if (data.nrt_configured) {
            const nrt = _computeNrtCoverage(data);
            if (nrt && (nrt.notCovered.length || nrt.partial.length || nrt.extra.length)) {
                const subLines = [];
                if (nrt.notCovered.length) {
                    const n = nrt.notCovered.length;
                    subLines.push(`нет NRT-коммуникаций на ${n} ${_nWord(n,'шаге','шагах','шагах')}: ${nrt.notCovered.map(s=>`«${s}»`).join(', ')} — рассмотрите запуск триггеров`);
                }
                if (nrt.partial.length) {
                    const n = nrt.partial.length;
                    subLines.push(`частичное покрытие на ${n} ${_nWord(n,'шаге','шагах','шагах')}: ${nrt.partial.map(s=>`«${s}»`).join(', ')} — добавьте недостающие события`);
                }
                if (nrt.extra.length) {
                    const n = nrt.extra.length;
                    subLines.push(`лишние NRT-триггеры на ${n} ${_nWord(n,'шаге','шагах','шагах')}: ${nrt.extra.map(s=>`«${s}»`).join(', ')} — проверьте актуальность`);
                }
                items.push(`<div class="rec-item"><div class="rec-num">${items.length + 1}</div><div class="rec-text">NRT-покрытие требует внимания:<br>• ${subLines.join('<br>• ')}</div></div>`);
            }
        }

        return `<div class="rec-block">${header}${items.join('')}</div>`;
    }

function buildNrtCoverageTile(data) {
        const nrt = _computeNrtCoverage(data);
        if (!nrt) return '';
        const { notCovered, partial, extra, fullyCovered, total } = nrt;
        const coveredPct = total > 0 ? Math.round(fullyCovered / total * 100) : 0;
        const header = `<div class="rec-header"><span class="rec-header-title">Покрытие NRT-коммуникациями</span></div>`;
        const topLine = `<div style="padding:12px 18px 4px;font-size:0.9rem;font-weight:700;">Покрыто NRT: ${fullyCovered} из ${total} ${_nWord(total, 'этапа', 'этапов', 'этапов')} (${coveredPct}%)</div>`;

        if (!notCovered.length && !partial.length && !extra.length) {
            return `<div class="rec-block">${header}${topLine}<div class="rec-item"><div class="rec-text" style="color:#2f7a2f;font-weight:600;">Все шаги воронки полностью покрыты NRT-коммуникациями ✅</div></div></div>`;
        }
        const items = [];
        let num = 0;
        if (notCovered.length) {
            const n = notCovered.length;
            items.push(`<div class="rec-item"><div class="rec-num">${++num}</div><div class="rec-text">Полностью NRT не покрыто ${n} ${_nWord(n, 'шаг', 'шага', 'шагов')}: ${notCovered.map(s => `«${s}»`).join(', ')}</div></div>`);
        }
        if (partial.length) {
            const n = partial.length;
            items.push(`<div class="rec-item"><div class="rec-num">${++num}</div><div class="rec-text">В ${n} ${_nWord(n, 'шаге', 'шагах', 'шагах')} имеется частичное покрытие: ${partial.map(s => `«${s}»`).join(', ')}</div></div>`);
        }
        if (extra.length) {
            const n = extra.length;
            items.push(`<div class="rec-item"><div class="rec-num">${++num}</div><div class="rec-text">В ${n} ${_nWord(n, 'шаге', 'шагах', 'шагах')} имеются лишние настроенные NRT-триггеры: ${extra.map(s => `«${s}»`).join(', ')}</div></div>`);
        }
        return `<div class="rec-block">${header}${topLine}${items.join('')}</div>`;
    }

function buildFunnelHtml(data, funnelName, dateFrom, dateTo) {
        const funnel = data.funnel || {};
        const prevFunnel = data.prev_funnel || {};
        const tl = data.traffic_light || 'yellow';
        const prevPeriod = data.prev_period;
        const nrtMatches = data.nrt_matches || {};
        const nrtConfigured = !!data.nrt_configured;

        if (!Object.keys(funnel).length) {
            return '<div style="color:var(--text-muted);padding:16px 0;">Нет данных для выбранного фильтра</div>';
        }

        const keys = Object.keys(funnel).map(Number).sort((a, b) => a - b);
        const first = keys[0], last = keys[keys.length - 1];
        const topVal = funnel[first].count;
        const botVal = funnel[last].count;
        const totalConv = (funnel[last].conv_from_start * 100).toFixed(1);

        let _eaCounter = 0;
        const rows = keys.map(sn => {
            const row = funnel[sn];
            const barPct = (row.conv_from_start * 100).toFixed(1);

            let prevCell = '<span style="color:var(--text-muted);">—</span>';
            if (row.conv_from_prev != null) {
                prevCell = _convBadge(parseFloat((row.conv_from_prev * 100).toFixed(1)), 70, 50);
            }
            const sp = parseFloat((row.conv_from_start * 100).toFixed(1));

            let deltaCell = '<span style="color:var(--text-muted);">—</span>';
            const prevRow = prevFunnel[sn];
            if (prevRow) {
                const d = row.count - prevRow.count;
                deltaCell = `<span class="delta-cell ${_deltaClass(d)}">${_fmtDelta(d)}</span>`;
            }

            const actions = row.event_actions || [];
            const nrtList = nrtMatches[String(sn)] || [];
            const eaId = 'ea-row-' + (++_eaCounter);
            const hasDetail = actions.length > 0 || nrtList.length > 0;
            const badgeCount = actions.length;
            let eaCell, eaExpandedRow;
            if (hasDetail) {
                const badgeLabel = badgeCount > 0 ? String(badgeCount) : '·';
                eaCell = `<span class="ea-badge">${badgeLabel}</span>`;
                const itemsHtml = actions.length > 0
                    ? `<div class="ea-detail-label">Настроено ${actions.length} event_action</div><div class="ea-list">${actions.map(a => `<div class="ea-item">${a}</div>`).join('')}</div>`
                    : '';
                const nrtHtml = _buildNrtHtml(nrtList);
                const colspan = nrtConfigured ? 9 : 8;
                eaExpandedRow = `<tr id="${eaId}" class="ea-expanded" style="display:none;"><td colspan="${colspan}"><div class="ea-detail">${itemsHtml}${nrtHtml}</div></td></tr>`;
            } else {
                eaCell = `<span style="color:var(--text-muted);font-size:0.8rem;">—</span>`;
                eaExpandedRow = '';
            }

            // NRT intersection badge
            let nrtIntCell = '';
            if (nrtConfigured) {
                const nrtCovered = new Set();
                for (const g of nrtList) {
                    for (const e of g.events) {
                        if (e.matched) nrtCovered.add(_stripPfx(e.original));
                    }
                }
                const coveredCount = actions.filter(a => nrtCovered.has(a)).length;
                const cls = actions.length === 0 ? 'nrt-int-none'
                    : coveredCount === actions.length ? 'nrt-int-full'
                    : coveredCount > 0 ? 'nrt-int-partial'
                    : 'nrt-int-none';
                nrtIntCell = `<td style="white-space:nowrap;"><span class="nrt-int-badge ${cls}">${coveredCount}</span></td>`;
            }

            const trAttrs = hasDetail ? `style="cursor:pointer;" onclick="toggleActions('${eaId}', this)"` : '';
            return `<tr ${trAttrs}>
                <td class="step-num">${sn}</td>
                <td class="step-name">${row.step_name}</td>
                <td style="white-space:nowrap;">${eaCell}</td>
                ${nrtIntCell}
                <td class="step-value">${_fmt(row.count)}</td>
                <td class="delta-cell">${deltaCell}</td>
                <td class="conv-cell">${prevCell}</td>
                <td class="conv-cell">${_convBadge(sp, 70, 30)}</td>
                <td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${barPct}%;"></div></div></td>
            </tr>${eaExpandedRow}`;
        }).join('');

        const prevLabel = prevPeriod ? `${prevPeriod.date_from} — ${prevPeriod.date_to}` : '—';

        const tlLabels = {green: 'Рост', yellow: 'Нейтрально', red: 'Снижение'};
        const tlDescs = {
            green:  'Количество событий на последнем шаге растёт относительно прошлого периода',
            yellow: 'Незначительное снижение или недостаточно данных для устойчивого тренда',
            red:    'На протяжении 3+ периодов наблюдается последовательное снижение',
        };

        return `<div class="funnel-summary">
            <div class="summary-card">
                <div class="summary-label">Воронка</div>
                <div class="summary-value" style="font-size:1.1rem;">${funnelName}</div>
                <div class="summary-sub">${dateFrom} — ${dateTo}</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Входящих</div>
                <div class="summary-value">${_fmt(topVal)}</div>
                <div class="summary-sub">${funnel[first].step_name}</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Финальных</div>
                <div class="summary-value">${_fmt(botVal)}</div>
                <div class="summary-sub">${funnel[last].step_name}</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Итоговая конверсия</div>
                <div class="summary-value">${totalConv}%</div>
                <div class="summary-sub">от начала до финала</div>
            </div>
        </div>

        <div class="funnel-wrap">
            <table class="funnel-table">
                <thead>
                    <tr>
                        <th class="step-num">#</th>
                        <th>Шаг</th>
                        <th style="white-space:nowrap;">События</th>
                        ${nrtConfigured ? '<th style="white-space:nowrap;">NRT</th>' : ''}
                        <th>Кол-во</th>
                        <th>Дельта к пред.</th>
                        <th>Конв. к пред.</th>
                        <th>Конв. от начала</th>
                        <th class="bar-cell">Ширина воронки</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
        </div>

        <div class="traffic-light-block" style="margin-top:20px;">
            <div class="traffic-dot traffic-dot-${tl}"></div>
            <div>
                <div class="traffic-label traffic-${tl}" style="display:flex;align-items:center;">
                    ${tlLabels[tl] || tl}
                    <span class="tooltip-wrap">
                        <span class="tooltip-icon">?</span>
                        <div class="tooltip-box">
                            <div class="tooltip-step"><span class="tooltip-num">🟢</span> <strong>Рост:</strong> количество событий на последнем шаге в текущем периоде больше, чем в предыдущем (любой рост).</div>
                            <div class="tooltip-step"><span class="tooltip-num">🟡</span> <strong>Нейтрально:</strong> текущий период ≤ предыдущего, но условие красного не выполнено — либо снижение только 1–2 периода подряд, либо данных меньше 4 периодов.</div>
                            <div class="tooltip-step"><span class="tooltip-num">🔴</span> <strong>Критично:</strong> каждый из последних 3 периодов строго меньше предыдущего (нужно минимум 4 периода в истории).</div>
                        </div>
                    </span>
                </div>
                <div class="traffic-desc">${tlDescs[tl] || ''}</div>
                <div class="traffic-desc" style="margin-top:4px;">Сравнение с предыдущим периодом: ${prevLabel}</div>
            </div>
        </div>

        ${buildRecommendations(data, funnelName)}
        ${buildNrtCoverageTile(data)}
        ${buildStepsDetail(keys, funnel, prevFunnel)}
        ${buildAnalyticsHtml(data.analytics)}`;
    }

function _renderForFilters(funnelName, periodKey) {
    const funnelId = _funnelNameToId[funnelName]; if (!funnelId) return;
    const fData = (_ALL_DATA.data[funnelId] || {})[periodKey]; if (!fData) return;
    const parts = periodKey.split("|");
    document.getElementById("funnel-result").innerHTML = buildFunnelHtml(fData, funnelName, parts[0], parts[1]);
}
function _onFunnel() {
    var fn = document.getElementById("exp-funnel").value.trim();
    _renderForFilters(fn, document.getElementById("exp-period").value);
}

}
