// ── вшитый лист: дерево и коммуникации открываются поверх страницы ───────
// Страница дерева вшита целиком: лист открывается из этого же файла, а не
// ссылкой на соседний. Вид при открытии подменяется в литерале INITIAL_VIEW.
const TREE_PAGE = JSON.parse(document.getElementById('tree-page').textContent);
const TREE_VIEW_MARK = '/*__INITIAL_VIEW__*/null';
const SHEETS = {
  comms: {title: 'Коммуникации по пролонгации', view: {type: 'comm', id: 'comm-prolongation', soloPage: true}},
  tree: {title: 'Дерево оттоков', view: {fullscreen: true, soloTree: true}},
};

// Срез для блока сценариев: разрез и период страницы.
function scenariosView() {
  return {measure: state.measure, period: state.period, periodLabel: periodLabel(state.period)};
}

function renderScenarios() {
  // Блок сценариев объявлен следующим скриптом; первый render идёт до него.
  if (window.ScenariosPage) window.ScenariosPage.update(scenariosView());
}

// srcdoc, а не blob: страницу открывают с диска, и file:// под blob-ссылкой
// в iframe работает не во всех браузерах.
function openSheet(key) {
  // Сценарии теперь блок на странице: ссылка просто прокручивает к нему.
  if (key === 'scenarios') {
    document.getElementById('scenarios').scrollIntoView({behavior: 'smooth', block: 'start'});
    return;
  }
  const sheet = SHEETS[key];
  if (!sheet) return;
  // Лист наследует период и разрез страницы: две разные настройки на одном
  // экране читались бы как расхождение данных.
  const view = {...sheet.view, period: {id: state.period, label: periodLabel(state.period)},
    measure: state.measure};
  document.getElementById('sheetTitle').textContent = sheet.title;
  document.getElementById('sheetFrame').srcdoc =
    TREE_PAGE.replace(TREE_VIEW_MARK, JSON.stringify(view));
  document.getElementById('sheet').hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('sheetClose').focus();
}

function closeSheet() {
  document.getElementById('sheet').hidden = true;
  // Пустой srcdoc глушит графики внутри листа, пока он закрыт.
  document.getElementById('sheetFrame').srcdoc = '';
  document.body.style.overflow = '';
}

document.getElementById('sheetClose').addEventListener('click', closeSheet);
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && !document.getElementById('sheet').hidden) closeSheet();
});

// ── сборка страницы ───────────────────────────────────────────────────────
function render() {
  renderSwitches();
  renderPromoNote();
  renderOutflowDefinition();
  renderFunnelTitle();
  renderKpi();
  renderFunnels();
  renderStatus();
  renderScenarios();
  renderNote();
}

renderFilters();
render();
</script>
<script>
// ── блок «Сценарии оттока» под светофором ────────────────────────────────
// Разрез и период берёт у страницы через update(). Всё обёрнуто в IIFE,
// чтобы имена не пересеклись с кодом отчёта.
window.ScenariosPage = (() => {
  // Данные — блок scenarios из prolongation-data.json: отток (outflow) по
  // коммуникациям × сценариям. Сценарии взаимоисключающие, поэтому группа —
  // сумма своих сценариев. Коммуникации пересекаются: доли не складываются.
  const SC = DATA.scenarios;
  const TOTAL = 'ALL';
  const SERVICE = '900';
  const GROUP_COLORS = {
    transfers_atm: ['#FF3D64', '#fff'],
    PAYMENTS: ['#BA74B3', '#fff'],
    saving: ['#8AD554', 'rgba(0,0,0,.8)'],
    loans: ['#FFC636', 'rgba(0,0,0,.8)'],
    loans_new: ['#4DA2F1', '#fff'],
    other: ['#9AA3AD', '#fff'],
  };
  const COMM_COLORS = {
    promo: 'var(--promo)', no_promo: '#9AA3AD', stop_list: '#E9033A',
    'promo.deposit': '#4DA2F1', 'promo.deposit.prolongation': '#1F6FBF',
    'promo.saving': '#8AD554', 'promo.invest': '#FFC636', 'promo.oms': '#BA74B3',
  };

  // sub — сценарий внутри группы: покрытие и санки считаются по нему.
  const S = {measure: 'clnt', period: null, periodLabel: '', pick: null, sub: null};

  // ── утилиты ─────────────────────────────────────────────────────────────
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const mk = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  };
  const svg = (tag, attrs = {}) => {
    const node = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
    return node;
  };
  const fmt = (value, digits = 0) => new Intl.NumberFormat('ru-RU', {
    minimumFractionDigits: digits, maximumFractionDigits: digits,
  }).format(value);
  const money = () => S.measure === 'rur';
  const amount = (v) => (money()
    ? `${fmt(v, v < 10 ? 2 : 1)} млрд ₽`
    : v >= 1000 ? `${fmt(v / 1000, 1)} тыс.` : fmt(v));
  const last = (list) => list[list.length - 1];
  const colorOf = (g) => (GROUP_COLORS[g.id] || ['#9AA3AD', '#fff']);
  const comm = (id) => SC.communications.find((c) => c.id === id);
  const commColor = (c) => COMM_COLORS[c.id] || COMM_COLORS[c.parent] || '#9AA3AD';

  // Отток группы в коммуникации за период; без периода — текущий.
  const groupValue = (commId, groupId, period = S.period) => {
    const block = ((SC.values[period] || {})[commId] || {}).groups || {};
    return (block[groupId] || {})[S.measure] || 0;
  };
  const scenarioValue = (scenarioId) => {
    const block = ((SC.values[S.period] || {})[TOTAL] || {}).scenarios || {};
    return (block[scenarioId] || {})[S.measure] || 0;
  };
  const totalOutflow = () => SC.groups.reduce((sum, g) => sum + groupValue(TOTAL, g.id), 0);
  const groupShare = (g) => {
    const total = totalOutflow();
    return total ? groupValue(TOTAL, g.id) / total * 100 : 0;
  };
  // Фокус детализации: вся группа или один её сценарий.
  const focusOf = (g) => {
    const s = S.sub && g.scenarios.find((x) => x.id === S.sub);
    return s ? {kind: 'scenarios', id: s.id, name: s.name, of: 'сценария'}
      : {kind: 'groups', id: g.id, name: g.name, of: 'группы'};
  };
  const focusValue = (commId, f, period = S.period) => {
    const block = ((SC.values[period] || {})[commId] || {})[f.kind] || {};
    return (block[f.id] || {})[S.measure] || 0;
  };
  const cover = (commId, f, period = S.period) => {
    const base = focusValue(TOTAL, f, period);
    return base ? focusValue(commId, f, period) / base * 100 : null;
  };
  // Ряд покрытия до выбранного периода — для дельты и микрографика.
  const coverSeries = (commId, f) => {
    const upto = PERIODS_ASC.indexOf(S.period);
    return PERIODS_ASC.slice(0, upto + 1)
      .map((p) => cover(commId, f, p))
      .filter((v) => v != null);
  };

  function delta(series) {
    const d = last(series) - series[series.length - 2];
    const tone = d > 0.05 ? ' is-good' : d < -0.05 ? ' is-bad' : '';
    const arrow = d > 0.05 ? '↑' : d < -0.05 ? '↓' : '→';
    return mk('span', 'scn-delta' + tone, `${arrow} ${d > 0 ? '+' : ''}${fmt(d, 1)} п.п. м/м`);
  }

  function spark(series, color) {
    const W = 232, H = 34, pad = 4;
    const min = Math.min(...series), max = Math.max(...series), span = max - min || 1;
    const x = (i) => pad + i * (W - pad * 2) / (series.length - 1);
    const y = (v) => pad + (1 - (v - min) / span) * (H - pad * 2);
    const pts = series.map((v, i) => `${x(i)},${y(v)}`);
    const root = svg('svg', {class: 'scn-spark', viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none',
      role: 'img', 'aria-label': series.map((v) => `${fmt(v, 1)}%`).join('; ')});
    root.append(svg('path', {d: `M${x(0)},${H} L${pts.join(' L')} L${x(series.length - 1)},${H} Z`,
      fill: color, 'fill-opacity': '.1'}));
    root.append(svg('polyline', {points: pts.join(' '), fill: 'none', stroke: color, 'stroke-opacity': '.55',
      'stroke-width': 2, 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke'}));
    root.append(svg('circle', {cx: x(series.length - 1), cy: y(last(series)), r: 3.5, fill: color}));
    return root;
  }

  // «Прочее» всегда в конце, остальное — по убыванию.
  const OTHER = 'other';
  const byValue = (value) => (a, b) => (a.id === OTHER) - (b.id === OTHER) || value(b) - value(a);
  const orderedGroups = () => SC.groups.filter((g) => groupShare(g) > 0).sort(byValue(groupShare));

  // ── полоса 100% ─────────────────────────────────────────────────────────
  function pick(id) {
    // Одна группа раскрыта всегда: повторный клик ничего не сворачивает.
    if (S.pick === id) return;
    S.pick = id;
    S.sub = null;
    render();
    if (S.pick) $('scnDetail').scrollIntoView({behavior: 'smooth', block: 'nearest'});
  }

  function renderBar() {
    const total = totalOutflow();
    $('scnTotal').innerHTML = `Весь отток за ${S.periodLabel.toLowerCase()}: <b>${amount(total)}</b>`;
    const bar = $('scnBar'), legend = $('scnLegend');
    bar.innerHTML = '';
    legend.innerHTML = '';
    bar.classList.toggle('has-pick', !!S.pick);

    orderedGroups().forEach((g) => {
      const share = groupShare(g);
      if (!share) return;
      const [color, ink] = colorOf(g);
      const label = `${fmt(share, share < 10 ? 1 : 0)}%`;
      const seg = mk('button');
      seg.type = 'button';
      seg.style.flex = `${share} 1 0`;
      seg.style.background = color;
      seg.style.color = ink;
      seg.title = `${g.name}: ${label} · ${amount(groupValue(TOTAL, g.id))}`;
      seg.setAttribute('aria-label', seg.title);
      seg.setAttribute('aria-pressed', String(S.pick === g.id));
      // В узком сегменте только процент — имя есть в легенде.
      seg.append(mk('span', null, share >= 14 ? `${g.name} · ${label}` : label));
      seg.addEventListener('click', () => pick(g.id));
      bar.append(seg);

      const item = mk('button');
      item.type = 'button';
      item.setAttribute('aria-pressed', String(S.pick === g.id));
      const dot = mk('i');
      dot.style.background = color;
      const name = mk('span', null, g.name);
      name.append(mk('small', null, amount(groupValue(TOTAL, g.id))));
      item.append(dot, name, mk('b', null, label));
      item.addEventListener('click', () => pick(g.id));
      const li = mk('li');
      li.append(item);
      legend.append(li);
    });
  }

  // ── состав группы: сценарии с долей внутри группы ──────────────────────
  function colTitle(text, action) {
    const head = mk('div', 'scn-col-title');
    head.append(mk('span', null, text));
    if (action) head.append(action);
    return head;
  }

  function barRow(label, share, value, color, deltaNode) {
    const li = mk('li');
    const head = mk('div', 'row-head');
    head.append(mk('span', null, label), mk('b', null, `${fmt(share, 1)}%`));
    if (deltaNode) head.append(deltaNode);
    else head.append(mk('small', null, value));
    const track = mk('div', 'scn-mini');
    const fill = mk('i');
    fill.style.width = `${Math.min(100, share)}%`;
    fill.style.background = color;
    track.append(fill);
    li.append(head, track);
    return li;
  }

  function pickSub(id) {
    S.sub = S.sub === id ? null : id;
    renderDetail();
  }

  function composition(g) {
    const col = mk('div', 'scn-col');
    col.append(colTitle('Из чего состоит'));
    const box = mk('div', 'scn-tile');
    const rows = mk('ul', 'scn-sub scn-sub-first scn-sub-pick');
    const total = groupValue(TOTAL, g.id);
    g.scenarios
      .map((s) => ({...s, value: scenarioValue(s.id)}))
      .filter((s) => s.value)
      .sort(byValue((s) => s.value))
      .forEach((s) => {
        const row = barRow(s.name, total ? s.value / total * 100 : 0, amount(s.value), colorOf(g)[0]);
        const button = mk('button', 'scn-pick');
        button.type = 'button';
        button.setAttribute('aria-pressed', String(S.sub === s.id));
        button.title = S.sub === s.id ? 'Вернуться ко всей группе' : 'Посмотреть покрытие сценария';
        button.append(...row.childNodes);
        button.querySelector('.row-head').append(mk('span', 'scn-go', '→'));
        button.addEventListener('click', () => pickSub(s.id));
        row.append(button);
        rows.append(row);
      });
    box.append(rows, mk('div', 'scn-note', 'Доля сценария в оттоке группы. Сценарии не пересекаются: '
      + 'комбинации вроде «POS + крупные платежи» — отдельная корзина.'));
    col.append(box);
    return col;
  }

  // ── покрытие коммуникациями ─────────────────────────────────────────────
  function tile(c, f) {
    const series = coverSeries(c.id, f);
    const card = mk('div', 'scn-tile');
    const head = mk('div', 'scn-tile-label');
    head.append(mk('span', null, c.name));
    const row = mk('div', 'scn-tile-row');
    row.append(mk('span', 'scn-tile-value', series.length ? `${fmt(last(series), 1)}%` : '—'));
    if (series.length > 1) row.append(delta(series));
    card.append(head, row);
    if (series.length > 1) card.append(spark(series, commColor(c)));
    card.append(mk('div', 'scn-tile-foot',
      `${amount(focusValue(c.id, f))} из ${amount(focusValue(TOTAL, f))}`));
    return card;
  }

  function coverage(g) {
    const f = focusOf(g);
    const col = mk('div', 'scn-col');
    col.append(colTitle(f.kind === 'scenarios' ? `Покрытие коммуникациями · ${f.name}` : 'Покрытие коммуникациями'));
    const tiles = mk('div', 'scn-tiles');
    SC.communications.filter((c) => !c.parent).forEach((c) => tiles.append(tile(c, f)));
    col.append(tiles);

    const products = SC.communications.filter((c) => c.parent === 'promo');
    if (products.length) {
      const box = mk('div', 'scn-tile');
      box.append(mk('div', 'scn-tile-label', 'Промо по продуктам'));
      const rows = mk('ul', 'scn-sub');
      products.forEach((c) => {
        const series = coverSeries(c.id, f);
        if (!series.length) return;
        rows.append(barRow(c.name, last(series), amount(focusValue(c.id, f)), commColor(c),
          series.length > 1 ? delta(series) : null));
      });
      box.append(rows);
      col.append(box);
    }
    return col;
  }

  // ── санки: отток группы → промо / без промо / стоп-лист → продукт → черновик
  // Ветки пересекаются, поэтому сумма узлов в колонке может быть больше
  // родителя: исходящие ленты родителя ужимаются пропорционально, а узлы
  // получателей рисуются в полный размер — их высота и есть покрытие.
  function sankey(g, afterClosure = false) {
    const f = focusOf(g);
    const col = mk('div', 'scn-col scn-sankey');
    col.append(colTitle(afterClosure ? 'Промо после закрытия вклада' : 'Промо до пролонгации'));
    const box = mk('div', 'scn-tile');
    const tip = mk('div', 'scn-sankey-tip');
    tip.hidden = true;
    box.append(tip);
    col.append(box);

    const [groupColor] = colorOf(g);
    const node = (c) => ({id: c.id, label: c.name, parent: c.parent || 'root',
      value: cover(c.id, f) || 0, color: commColor(c), kind: c.kind});
    const inSankey = SC.communications.filter((c) => c.kind !== 'service');
    const product = (id, label, value, parent, color, kind = 'promo') =>
      ({id, label, value, parent, color, kind});
    const columns = (afterClosure ? [
      [{id: 'root', label: 'Отток после закрытия вклада', value: 100, color: '#6C7580', parent: null}],
      [product('after_promo', 'Промо', 81.4, 'root', 'var(--promo)'),
        product('after_no_promo', 'Без промо', 18.6, 'root', '#9AA3AD', 'none')],
      [product('after_deposit', 'Вклад', 64.8, 'after_promo', '#4DA2F1'),
        product('after_invest', 'Инвест', 37.4, 'after_promo', '#FFC636'),
        product('after_oms', 'ОМС', 9.83, 'after_promo', '#BA74B3'),
        product('after_saving', 'Накопительный счёт', 48.2, 'after_promo', '#8AD554')],
      [product('after_deposit_draft', 'Вклад · черновики', 1.1, 'after_deposit', '#4DA2F1', 'draft'),
        product('after_invest_draft', 'Инвест · черновики', 0.1, 'after_invest', '#FFC636', 'draft'),
        product('after_oms_draft', 'ОМС · черновики', 0.06, 'after_oms', '#BA74B3', 'draft'),
        product('after_saving_draft', 'НС · черновики', 0.08, 'after_saving', '#8AD554', 'draft')],
    ] : [
      [{id: 'root', label: f.name, value: 100, color: groupColor, parent: null}],
      inSankey.filter((c) => !c.parent).map(node),
      inSankey.filter((c) => c.parent === 'promo').map(node),
      inSankey.filter((c) => c.kind === 'draft').map(node),
    ]).map((list) => list.filter((n) => n.value > 0));

    const W = 900, nw = 10, top = 8, gap = 10, k = 2.1, slot = 30;
    const xs = [4, 250, 500, 730];
    const byId = {};
    let H = 0;
    columns.forEach((list, ci) => {
      let y = top;
      list.forEach((n) => {
        n.x = xs[ci];
        n.h = Math.max(n.value * k, 2);
        // Черновик встаёт напротив своего продукта, чтобы ленты не перекрещивались.
        if (ci === 3 && byId[n.parent]) y = Math.max(y, byId[n.parent].y);
        n.y = y;
        y += Math.max(n.h, slot) + gap;
        byId[n.id] = n;
      });
      H = Math.max(H, y - gap + top);
    });

    const root = svg('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img',
      'aria-label': columns.flat().slice(1).map((n) => `${n.label} ${fmt(n.value, 1)}%`).join('; ')});
    const links = svg('g'), nodes = svg('g'), labels = svg('g');
    root.append(links, nodes, labels);

    // Ленты: у родителя — пропорциональный срез, у ребёнка — во всю высоту.
    columns.slice(1).flat().forEach((n) => {
      const p = byId[n.parent];
      if (!p) return;
      const siblings = columns.flat().filter((s) => s.parent === n.parent);
      const sum = siblings.reduce((acc, s) => acc + s.h, 0);
      const squeeze = sum > p.h ? p.h / sum : 1;
      const before = siblings.slice(0, siblings.indexOf(n)).reduce((acc, s) => acc + s.h * squeeze, 0);
      const ya = p.y + before, ha = n.h * squeeze;
      const xa = p.x + nw, xb = n.x, mx = (xa + xb) / 2;
      links.append(svg('path', {
        d: `M${xa},${ya} C${mx},${ya} ${mx},${n.y} ${xb},${n.y} L${xb},${n.y + n.h} `
          + `C${mx},${n.y + n.h} ${mx},${ya + ha} ${xa},${ya + ha} Z`,
        fill: n.color, 'fill-opacity': n.kind === 'draft' ? .35 : .22,
      }));
    });

    columns.flat().forEach((n) => {
      const rect = svg('rect', {x: n.x, y: n.y, width: nw, height: n.h, rx: 2, fill: n.color,
        'fill-opacity': n.kind === 'draft' ? .6 : 1, tabindex: 0, role: 'button',
        'aria-label': `${n.label}: ${fmt(n.value, 2)}%`});
      const showTip = () => {
        tip.textContent = `${n.label}: ${n.id === 'root' ? '100' : fmt(n.value, 2)}% оттока`;
        tip.hidden = false;
      };
      rect.addEventListener('pointerenter', showTip);
      rect.addEventListener('focus', showTip);
      rect.addEventListener('pointerleave', () => { tip.hidden = true; });
      rect.addEventListener('blur', () => { tip.hidden = true; });
      nodes.append(rect);
      const t = svg('text', {x: n.x + nw + 6, y: n.y + Math.min(n.h, slot) / 2 - 2, class: 'scn-sankey-label'});
      const a = svg('tspan', {'font-weight': 600});
      a.textContent = n.label;
      const b = svg('tspan', {x: n.x + nw + 6, dy: 13, class: 'scn-sankey-sub'});
      b.textContent = n.id === 'root'
        ? (afterClosure ? '100% оттока' : amount(focusValue(TOTAL, f)))
        : `${fmt(n.value, 1)}% оттока${afterClosure ? '' : ` ${f.of}`}`;
      t.append(a, b);
      labels.append(t);
    });
    box.append(root, mk('div', 'scn-sankey-note', afterClosure
      ? 'Доли — от общего оттока после закрытия вклада. Промо покрывает 81,4%, без промо — 18,6%. '
        + 'Продуктовые ветки пересекаются, поэтому их сумма может быть больше 81,4%; черновики — отдельный шаг.'
      : `Доли — от оттока ${f.of}. Ветки пересекаются: клиент мог получить несколько предложений, `
        + 'поэтому сумма узлов в колонке бывает больше 100%. Черновик — следующий шаг после промо своего '
        + 'продукта. Сервисные коммуникации в санки не входят.'));
    if (afterClosure) col.append(followupHistogram());
    return col;
  }

  function followupHistogram() {
    const card = mk('div', 'scn-tile scn-histogram');
    card.append(mk('div', 'scn-tile-label', 'Догоняем клиента через X дней после закрытия'));
    const bins = [
      {label: 'Тот же день', from: 0, to: 1, value: 71, color: '#4DA2F1'},
      {label: '1–3 дня', from: 1, to: 4, value: 11.54, color: '#8AD554'},
      {label: '4–7 дней', from: 4, to: 8, value: 9.11, color: '#FFC636'},
      {label: '8–14 дней', from: 8, to: 14, value: 7.62, color: '#BA74B3'},
    ];
    const W = 900, H = 190, left = 28, right = 12, top = 18, bottom = 28;
    const plotW = W - left - right, plotH = H - top - bottom, max = 75;
    const x = (day) => left + day / 14 * plotW;
    const pct = (value) => fmt(value, Number.isInteger(value) ? 0 : 2);
    const chart = svg('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img',
      'aria-label': bins.map((b) => `${b.label}: ${pct(b.value)}%`).join('; ')});
    [0, 25, 50, 75].forEach((value) => {
      const y = top + plotH - value / max * plotH;
      chart.append(svg('line', {x1: left, y1: y, x2: W - right, y2: y, class: 'scn-histogram-grid'}));
      const label = svg('text', {x: left - 7, y: y + 3, 'text-anchor': 'end', class: 'scn-histogram-tick'});
      label.textContent = `${value}%`;
      chart.append(label);
    });
    chart.append(svg('line', {x1: left, y1: top + plotH, x2: W - right, y2: top + plotH, class: 'scn-histogram-axis'}));
    bins.forEach((bin) => {
      const barX = x(bin.from) + 2;
      const barW = Math.max(4, x(bin.to) - x(bin.from) - 4);
      const barH = bin.value / max * plotH;
      const barY = top + plotH - barH;
      chart.append(svg('rect', {x: barX, y: barY, width: barW, height: barH, rx: 3,
        fill: bin.color, 'fill-opacity': .9}));
      const value = svg('text', {x: barX + barW / 2, y: Math.max(12, barY - 5),
        'text-anchor': 'middle', class: 'scn-histogram-value'});
      value.textContent = `${pct(bin.value)}%`;
      chart.append(value);
    });
    [0, 1, 4, 8, 14].forEach((day) => {
      const tick = svg('text', {x: x(day), y: H - 7, 'text-anchor': day === 0 ? 'start' : day === 14 ? 'end' : 'middle',
        class: 'scn-histogram-tick'});
      tick.textContent = String(day);
      chart.append(tick);
    });
    card.append(chart);
    const legend = mk('div', 'scn-histogram-legend');
    bins.forEach((bin) => {
      const item = mk('div', 'scn-histogram-legend-item');
      const swatch = mk('i');
      swatch.style.background = bin.color;
      item.append(swatch, mk('span', null, bin.label), mk('b', null, `${pct(bin.value)}%`));
      legend.append(item);
    });
    card.append(legend, mk('div', 'scn-sankey-note', 'Ширина столбца показывает диапазон дней, высота — долю клиентов.'));
    return card;
  }

  // ── детализация ─────────────────────────────────────────────────────────
  function renderDetail() {
    const host = $('scnDetail');
    host.innerHTML = '';
    const g = SC.groups.find((x) => x.id === S.pick);
    if (!g) {
      host.append(mk('div', 'scn-empty',
        'Нажмите на группу в полосе или легенде — покажем, из чего она состоит и чем её покрываем'));
      return;
    }
    const card = mk('div', 'scn-detail');
    const title = mk('div', 'scn-title');
    const dot = mk('i');
    dot.style.background = colorOf(g)[0];
    title.append(dot, mk('h3', null, g.name),
      mk('span', null, `${fmt(groupShare(g), 1)}% оттока · ${amount(groupValue(TOTAL, g.id))}`));
    card.append(title);

    const grid = mk('div', 'scn-grid');
    grid.append(composition(g), coverage(g));
    grid.append(sankey(g));
    grid.append(sankey(g, true));
    card.append(grid);
    host.append(card);
  }

  function render() {
    // По умолчанию раскрыта первая группа полосы.
    const groups = orderedGroups();
    if (!groups.some((g) => g.id === S.pick)) {
      S.pick = groups.length ? groups[0].id : null;
      S.sub = null;
    }
    renderBar();
    renderDetail();
    $('scnSynthetic').hidden = !SC.synthetic;
    $('scnNote').textContent = (SC.synthetic
      ? 'Разбивка по сценариям и коммуникациям — синтетика; итоги ALL / промо / без промо — факт. '
      : '')
      + 'Отток — колонка outflow выгрузки, no_outflow в полосу не входит. '
      + 'Покрытие — доля оттока группы, до которой дошла коммуникация.';
  }

  // Выбранная группа переживает смену разреза и периода.
  function update(view = {}) {
    if (!SC || !SC.values[view.period]) {
      $('scenarios').hidden = true;
      return;
    }
    $('scenarios').hidden = false;
    if (view.measure) S.measure = view.measure;
    S.period = view.period;
    S.periodLabel = view.periodLabel || view.period;
    render();
  }

  return {update};
})();

ScenariosPage.update(scenariosView());
</script>
</body>
