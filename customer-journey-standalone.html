      function formatCompactNumber(value) {
        if (Math.abs(value) >= 1000000) {
          const digits = Math.abs(value) >= 10000000 ? 1 : 2;
          return `${new Intl.NumberFormat('ru-RU', {minimumFractionDigits: digits, maximumFractionDigits: digits}).format(value / 1000000)} млн`;
        }
        if (Math.abs(value) >= 1000) return `${new Intl.NumberFormat('ru-RU', {maximumFractionDigits: 1}).format(value / 1000)} тыс.`;
        return new Intl.NumberFormat('ru-RU').format(value);
      }
      function formatPercent(value) { return `${new Intl.NumberFormat('ru-RU', {minimumFractionDigits: 1, maximumFractionDigits: 1}).format(value * 100)}%`; }
      function formatDelta(value) { return `${value > 0 ? '+' : ''}${formatPercent(value)}`; }
      function conversion(current, previous) { return previous ? current / previous : 0; }
      function change(current, previous) { return previous ? current / previous - 1 : 0; }
      function percentagePointChange(current, previous) { return (current - previous) * 100; }

      function makeFunnelChart(name, items) {
        return {series:{data:[{type:'funnel',name,shape:'rectangle',connectors:{enabled:true},dataLabels:{enabled:true,inside:false,align:'right',anchor:'plot',reserveSpace:true,preserveLineBreaks:true},data:items.map((item,index)=>({value:item.value,name:item.name,label:index===0?`${item.name}\n${formatCompactNumber(item.value)}`:`${item.name}\n${formatCompactNumber(item.value)} · ${formatPercent(conversion(item.value,items[index-1].value))}`}))}]},legend:{enabled:false},tooltip:{enabled:true}};
      }

          {type:'line',name:'Июнь 2026',data:current.map((item,index)=>({x:displayNames[index],y:item.value,name:item.name,label:item.value,custom:{fullName:item.name}})),marker:{enabled:true},dataLabels:{enabled:true}},
          {type:'line',name:'Май 2026',data:previous.map((item,index)=>({x:displayNames[index],y:item.value,name:item.name,custom:{fullName:item.name}})),marker:{enabled:true}},
        ]},xAxis:{type:'category',categories:displayNames,labels:{autoRotation:false}},yAxis:[{min:0,max:100}],legend:{enabled:true},tooltip:{enabled:true}};
      }
      function makeBarYChart(items) {
        const displayNames=['Техошибки','Статус','Согласия','Условия','Комм.'];
        return {series:{data:[{type:'bar-y',name:'Обращения',data:items.map((item,index)=>({x:item.value,y:displayNames[index],name:item.name,label:formatCompactNumber(item.value),custom:{fullName:item.name}})),dataLabels:{enabled:true}}]},yAxis:[{type:'category',categories:displayNames}],legend:{enabled:false},tooltip:{enabled:true}};
      }
      function makeWaterfallChart() {
        const sales=DATA.sales.current;
        const d=[{x:'Прямые',name:'Прямые продажи',y:sales.directCampaign,label:formatCompactNumber(sales.directCampaign),custom:{fullName:'Прямые продажи'}},{x:'Черновики',name:'Возврат через черновики',y:sales.recoveredDrafts,label:formatCompactNumber(sales.recoveredDrafts),custom:{fullName:'Возврат через черновики'}},{x:'Кампейнинг',name:'Продажи кампейнинга',total:true,label:formatCompactNumber(sales.campaignTotal),custom:{fullName:'Продажи кампейнинга'}},{x:'Без камп.',name:'Без кампейнинга',y:sales.nonCampaign,label:formatCompactNumber(sales.nonCampaign),custom:{fullName:'Без кампейнинга'}},{x:'Всего',name:'Всего продаж',total:true,label:formatCompactNumber(sales.total),custom:{fullName:'Всего продаж'}}];
        return {series:{data:[{type:'waterfall',name:'Продажи',data:d,dataLabels:{enabled:true}}]},xAxis:{type:'category',categories:d.map((v)=>v.x)},legend:{enabled:false},tooltip:{enabled:true}};

          {theme:'danger',label:'–20%',title:'На шаге согласий теряется 206 тыс. клиентов',description:'Потеря выросла примерно на 6 п.п. относительно предыдущего периода',action:'Проверить клиентский опыт',target:'csi'},
          {theme:'warning',label:'428 тыс.',title:'Большой объём незавершённых оформлений',description:'Клиенты, не дошедшие до прямой продажи, формируют пул для механики черновиков',action:'Проверить догрев через черновики',target:'drafts'},
          {theme:'warning',label:'Гипотезы',title:'Проблемы концентрируются вокруг одного участка пути',description:'Непонятные согласия, повторный ввод данных и технические ошибки совпадают с ключевой точкой оттока',action:'Посмотреть жалобы',target:'complaints'}]},
        {id:'drafts',sectionId:'story-drafts',title:'Черновики и догрев',summary:'Коммуникацией покрыто только 150 тыс. из 428 тыс. незавершённых оформлений. 278 тыс. клиентов не получают догрев.',recommendation:{theme:'warning',text:'Подключить 13 событий, начиная с незавершения на согласиях, технической ошибки и прерывания после проверки.'},caption:'28 тыс. восстановленных продаж уже входят в 700 тыс. продаж кампейнинга.',chart:'drafts',signals:[
          {theme:'warning',label:'7 из 20',title:'Большая часть событий не запускает коммуникацию',description:'Покрытие триггерных событий составляет только 35%',action:'Посмотреть влияние на продажи',target:'result'},
          {theme:'danger',label:'278 тыс.',title:'Клиенты остаются без коммуникации',description:'65% незавершивших оформление не получают сообщение или push для возврата',action:'Проверить жалобы на коммуникации',target:'complaints'},
          {theme:'danger',label:'46,7%',title:'Цель по восстановленным продажам не выполнена',description:'Факт — 28 тыс. при цели 60 тыс. Разрыв составляет 32 тыс. продаж',action:'Посмотреть итоговый результат',target:'result'}]},
        {id:'csi',sectionId:'story-csi',title:'CSI по этапам пути',summary:'CSI на этапе согласий составляет 63 пункта — на 7 пунктов ниже предыдущего периода и значительно ниже остальных этапов.',recommendation:{theme:'info',text:'Использовать CSI как подтверждающий сигнал, но не как доказательство причины. Сопоставить падение с обращениями и техническими событиями'},caption:'Текущий и предыдущий период; шкала CSI от 0 до 100.',chart:'csi',signals:[
          {theme:'danger',label:'63',title:'Минимум CSI совпадает с максимумом оттока',description:'На этапе согласий одновременно наблюдаются худшая оценка опыта и максимальная потеря клиентов',action:'Посмотреть структуру обращений',target:'complaints'},
          {theme:'danger',label:'–7',title:'Проблема усилилась относительно прошлого периода',description:'CSI на шаге согласий снизился с 70 до 63',action:'Вернуться к воронке СБОЛ',target:'sbol'}]},
        {id:'complaints',sectionId:'story-complaints',title:'Жалобы и обращения',summary:'Количество обращений выросло на 13,1%, до 28,4 тыс. Технические ошибки и вопросы по согласиям формируют 52% всего объёма.',recommendation:{theme:'warning',text:'Объединить технические ошибки, согласия и повторный ввод данных в одну программу улучшения этапа оформления'},caption:'Тематики обращений за текущий месяц; 2,4 обращения на 1 000 MAU.',chart:'complaints',signals:[
          {theme:'danger',label:'52%',title:'Технические ошибки и согласия — основной кластер проблем',description:'Эти тематики напрямую соответствуют участку максимального оттока в СБОЛ',action:'Вернуться к воронке СБОЛ',target:'sbol'},
          {theme:'info',label:'2,4',title:'2,4 обращения на 1 000 MAU',description:'Активная аудитория остаётся стабильной, поэтому рост обращений нельзя объяснить только ростом базы',action:'Посмотреть итоговую картину',target:'result'}]},
        {id:'result',sectionId:'story-result',title:'Итоговый бизнес-результат',summary:'Кампейнинг формирует 700 тыс. продаж, или 70% общего результата. Из них 672 тыс. получены напрямую и только 28 тыс. восстановлены через черновики.',recommendation:{theme:'success',text:'Три главных действия: восстановить частоту пилотных запусков, устранить потери на согласиях и расширить покрытие черновиков с 7 до 20 событий'},caption:'Waterfall исключает двойной счёт восстановленных продаж.',chart:'result',signals:[
          {theme:'danger',label:'–6,5%',title:'Общие продажи снизились',description:'Результат снизился с 1,07 до 1,00 млн. Основное снижение приходится на кампейнинг',action:'Вернуться к общей воронке',target:'overview'},
          {theme:'info',label:'42,9%',title:'Активная аудитория стабильна',description:'MAU — 12,0 млн, YAU — 28,0 млн. Основная проблема находится в конверсии пути, а не в размере активной аудитории',action:'Проверить воронку СБОЛ',target:'sbol'},
          {theme:'warning',label:'до 52 тыс.',title:'Есть сценарный потенциал в черновиках',description:'Расширение покрытия коммуникацией может вернуть дополнительный объём продаж. Это сценарная оценка, а не прогноз',action:'Проверить черновики',target:'drafts'}]},
      ];

      function activeChart(step, campaignChannel) {
        if (step.chart==='campaign') return makeFunnelChart('Воронка кампейнинга',DATA.campaign.current[campaignChannel]);
        if (step.chart==='pilots') return makeFunnelChart('Пилотные кампании',DATA.pilots.current);
        if (step.chart==='sbol') return makeFunnelChart('Оформление в СБОЛ',DATA.sbol.current);
        if (step.chart==='drafts') return makeFunnelChart('Черновики и догрев',DATA.drafts.funnel);
        if (step.chart==='csi') return makeLineChart(DATA.csi.current,DATA.csi.previous);
        if (step.chart==='complaints') return makeBarYChart(DATA.complaints.themes);
        return makeWaterfallChart();
      }

      function StageMap({activeStepId,onNavigate}) {
        return <Box className="stage-map">{STORY_NAVIGATION.map((item)=><Button key={item.id} view={item.id===activeStepId?'outlined':'flat'} size="m" className="stage-button" onClick={()=>onNavigate(item.id)}><Box className="stage-content"><Label theme="utility">{item.number}</Label><Flex className="stage-copy" direction="column" alignItems="flex-start" gap="1"><Text variant="subheader-1">{item.title}</Text><Label className="stage-status" theme={item.theme}>{item.status}</Label></Flex></Box></Button>)}</Box>;
      }

      function ActiveStoryPanel({step,index,campaignChannel,setCampaignChannel}) {
        const triggerCoverage=conversion(DATA.drafts.connectedTriggerEvents,DATA.drafts.totalTriggerEvents);
        const goalProgress=conversion(DATA.drafts.actualSales,DATA.drafts.goalSales);
        return <Box className="active-panel">
          <Box className="active-heading">
            <Box className="active-copy"><Flex gap="2" alignItems="center" wrap><Label theme="utility">Этап {index+1} из {STORY_STEPS.length}</Label><Label theme={STORY_NAVIGATION[index].theme}>{STORY_NAVIGATION[index].status}</Label></Flex><Text variant="header-1">{step.title}</Text></Box>
            {step.id==='result' && <Label theme="success">700 тыс. · 70%</Label>}
          </Box>
          <Box className="mobile-finding"><Alert theme={step.recommendation.theme} view="outlined" title="Главный вывод" message={step.summary}/></Box>
          {step.chart==='campaign' && <SegmentedRadioGroup value={campaignChannel} onUpdate={setCampaignChannel} size="s" width="max">
            <SegmentedRadioGroup.Option value="total">Тотал</SegmentedRadioGroup.Option><SegmentedRadioGroup.Option value="push">Push</SegmentedRadioGroup.Option><SegmentedRadioGroup.Option value="inApp">In-app</SegmentedRadioGroup.Option><SegmentedRadioGroup.Option value="emailSms">Email и SMS</SegmentedRadioGroup.Option>
          </SegmentedRadioGroup>}
          <Divider/>
          <Box className="chart-box"><Chart key={`${step.id}-${campaignChannel}`} data={activeChart(step,campaignChannel)} lang="ru"/></Box>
          <Flex className="chart-caption"><Icon data={CircleInfo} size={14}/><Text variant="body-1" color="secondary">{step.caption}</Text></Flex>
          {step.chart==='drafts' && <Box className="progress-area">
            <Box className="progress-row"><Text variant="body-2">Покрытие триггеров</Text><Label theme="warning">{formatPercent(triggerCoverage)}</Label></Box><Progress value={triggerCoverage*100} size="s" theme="warning"/>
            <Box className="progress-row"><Text variant="body-2">Выполнение цели</Text><Label theme="danger">{formatPercent(goalProgress)}</Label></Box><Progress value={goalProgress*100} size="s" theme="danger"/>
          </Box>}
        </Box>;
      }

      function ContextPanel({step,onNavigate}) {
        return <Box className="context-panel">
          <Box className="desktop-finding"><Alert theme={step.recommendation.theme} view="outlined" title="Главный вывод" message={step.summary}/></Box>
          <Divider/>
          <Box className="context-section"><Text variant="subheader-2">Сигналы для решения</Text><Box className="signals">{step.signals.slice(0,2).map((signal,signalIndex)=><React.Fragment key={signal.title}>{signalIndex>0&&<Divider/>}<Button view="flat" size="l" width="max" className="signal-button" onClick={()=>onNavigate(signal.target)}><Box className="signal-content"><Label theme={signal.theme}>{signal.label}</Label><Box className="signal-copy"><Text variant="subheader-1">{signal.title}</Text><Text variant="body-2" color="secondary">{signal.description}</Text><Flex className="signal-action"><Text variant="body-2" color="link">{signal.action}</Text><Icon data={ArrowRight} size={14}/></Flex></Box></Box></Button></React.Fragment>)}</Box></Box>
          <Divider/>
          <Box className="context-section"><Text variant="subheader-2">Следующее действие</Text><Text variant="body-2">{step.recommendation.text}</Text></Box>
        </Box>;
      }

      function App(){
        const initialStage=window.location.hash.slice(1); const [period,setPeriod]=useState(['june']); const [product,setProduct]=useState(['all']); const [activeStepId,setActiveStepId]=useState(STORY_STEPS.some((step)=>step.id===initialStage)?initialStage:'overview'); const [campaignChannel,setCampaignChannel]=useState('total');
        const activeStep=STORY_STEPS.find((s)=>s.id===activeStepId); const activeIndex=STORY_STEPS.findIndex((s)=>s.id===activeStepId);
        const navigateToStep=(id)=>{setActiveStepId(id);window.history.replaceState(null,'',`#${id}`);};
        return <ThemeProvider theme="light"><Box className="page"><Box className="page-stack">
          <header className="page-header"><Box className="header-copy"><Flex gap="2" alignItems="center" wrap><Text variant="header-1">Жизненный путь клиента</Text><Label theme="utility">Синтетические данные</Label></Flex><Text variant="body-1" color="secondary">От кампейнинга до продажи и клиентского опыта</Text></Box><Box className="header-controls"><Select aria-label="Период" label="Период" width="max" value={period} onUpdate={setPeriod} options={[{value:'june',content:'Июнь 2026'},{value:'may',content:'Май 2026'},{value:'april',content:'Апрель 2026'}]}/><Select aria-label="Продукт" label="Продукт" width="max" value={product} onUpdate={setProduct} options={[{value:'all',content:'Все продукты'},{value:'credit',content:'Кредит'},{value:'card',content:'Карта'},{value:'deposit',content:'Вклад'}]}/></Box></header>
          <Card view="outlined" type="container" size="l" className="workspace"><StageMap activeStepId={activeStepId} onNavigate={navigateToStep}/><Box className="mobile-stage-select"><Select aria-label="Этап пути" label="Этап пути" width="max" value={[activeStepId]} onUpdate={(value)=>navigateToStep(value[0])} options={STORY_NAVIGATION.map((item)=>({value:item.id,content:`${item.number} · ${item.title} — ${item.status}`}))}/></Box><Divider/><Box className="workspace-content"><ActiveStoryPanel step={activeStep} index={activeIndex} campaignChannel={campaignChannel} setCampaignChannel={setCampaignChannel}/><Divider orientation="vertical" className="column-divider"/><ContextPanel step={activeStep} onNavigate={navigateToStep}/></Box></Card>
          <Box className="footer"><Text variant="body-1" color="secondary">Все данные синтетические. Связи между пилотами, воронками, CSI, жалобами и продажами отражают аналитические гипотезы и не являются доказанной причинностью.</Text></Box>
        </Box></Box></ThemeProvider>;
      }
      createRoot(document.getElementById('root')).render(<App/>);
    </script>
  </body>
</html>
